<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NoSimulcast - AI Recommendations</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #31103f 100%);
      --header-bg: rgba(15, 23, 42, 0.95);
      --card-bg: rgba(30, 41, 59, 0.9);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary-blue: #38bdf8;
      --ai-purple: #c084fc;
      --light-blue: rgba(56, 189, 248, 0.15);
      
      --badge-blue: #3b82f6;      
      --badge-orange: #f97316;    
      --badge-red: #ef4444;       
      --badge-green: #10b981;     
      --badge-yellow: #eab308;    
      --badge-purple: #a855f7;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      padding-bottom: 40px;
      min-height: 100vh;
    }

    header {
      background: var(--header-bg);
      backdrop-filter: blur(10px);
      padding: 12px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--primary-blue);
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }

    .container { 
      padding: 15px; 
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Sezione Consigli IA */
    .ai-box {
      background: rgba(192, 132, 252, 0.1);
      border: 1px solid rgba(192, 132, 252, 0.3);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
      backdrop-filter: blur(8px);
    }

    .ai-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--ai-purple);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ai-input-group {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .ai-input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(192, 132, 252, 0.4);
      background: rgba(0,0,0,0.3);
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }

    .ai-btn {
      background: var(--ai-purple);
      color: #0f172a;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .ai-btn:hover { opacity: 0.9; }

    /* Filtri & Ricerca */
    .filter-bar {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
      background: var(--card-bg);
      padding: 15px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .search-input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(0,0,0,0.3);
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .filter-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .filter-select {
      background: rgba(255,255,255,0.05);
      color: var(--text-main);
      border: 1px solid rgba(255,255,255,0.15);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      outline: none;
      flex: 1;
      min-width: 130px;
    }

    .view-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      overflow-x: auto;
      padding-bottom: 5px;
    }

    .tab-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .tab-btn.active {
      background: var(--primary-blue);
      color: #0f172a;
      border-color: var(--primary-blue);
      font-weight: 700;
    }

    /* Griglia Stremio */
    .stremio-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
    }

    @media (min-width: 768px) {
      .stremio-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
    }

    .anime-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.05);
      transition: transform 0.2s ease;
      display: flex;
      flex-direction: column;
    }

    .anime-card:hover { transform: translateY(-5px); }

    .poster-container { position: relative; width: 100%; aspect-ratio: 2 / 3; }
    .poster-img { width: 100%; height: 100%; object-fit: cover; }

    .status-badge {
      position: absolute;
      top: 6px; right: 6px;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 0.58rem;
      font-weight: 800;
      color: #fff;
      text-transform: uppercase;
    }

    .card-info { padding: 10px; display: flex; flex-direction: column; gap: 4px; }
    .anime-title { font-size: 0.85rem; font-weight: 700; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    .infinite-loader { text-align: center; padding: 30px; font-size: 0.9rem; color: var(--primary-blue); display: none; font-weight: 600; }

    /* Modal */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); z-index: 200;
      justify-content: center; align-items: flex-end;
    }

    .modal-content {
      background: #1e293b; color: #f8fafc; width: 100%; max-width: 500px;
      border-radius: 20px 20px 0 0; padding: 20px; max-height: 80vh; overflow-y: auto;
    }

    .close-btn { float: right; font-size: 1.5rem; font-weight: bold; cursor: pointer; color: #94a3b8; }
  </style>
</head>
<body>

  <header>
    <div class="logo">NoSimulcast 🌸</div>
  </header>

  <div class="container">
    
    <!-- Box Raccomandazioni Personali IA -->
    <div class="ai-box">
      <div class="ai-title">🤖 Suggerimenti Personali basati su IA</div>
      <div style="font-size:0.8rem; color: #cbd5e1;">Scrivi un anime che ti è piaciuto molto per scoprire titoli simili con la stessa atmosfera:</div>
      <div class="ai-input-group">
        <input type="text" id="ai-anime-input" class="ai-input" placeholder="Es. Attack on Titan, Solo Leveling, Toradora...">
        <button class="ai-btn" onclick="getAIRecommendations()">Trova Simili ✨</button>
      </div>
    </div>

    <!-- Filtri e Ricerca Globale -->
    <div class="filter-bar">
      <input type="text" id="search-input" class="search-input" placeholder="🔍 Cerca qualsiasi anime nel database..." oninput="handleSearch()">
      
      <div class="filter-group">
        <select id="genre-select" class="filter-select" onchange="applyFilters()">
          <option value="">🎭 Tutti i Generi</option>
          <option value="Action">Azione</option>
          <option value="Adventure">Avventura</option>
          <option value="Comedy">Commedia</option>
          <option value="Drama">Drammatico</option>
          <option value="Fantasy">Fantasy</option>
          <option value="Romance">Romantico</option>
          <option value="Sci-Fi">Sci-Fi</option>
          <option value="Slice of Life">Slice of Life</option>
        </select>

        <select id="format-select" class="filter-select" onchange="applyFilters()">
          <option value="">🎬 Tutti i Formati</option>
          <option value="TV">Serie TV</option>
          <option value="MOVIE">Film / Movie</option>
          <option value="OVA">OVA / Speciale</option>
        </select>
      </div>
    </div>

    <!-- Categorie Stremio -->
    <div class="view-tabs">
      <button class="tab-btn active" onclick="switchTab('ALL', this)">🔥 Tutti</button>
      <button class="tab-btn" onclick="switchTab('READY', this)">🟢 Pronti per il Binge</button>
      <button class="tab-btn" onclick="switchTab('AIRING', this)">🔵 / 🟠 In Corso / Simulcast</button>
      <button class="tab-btn" onclick="switchTab('ENDED', this)">🔴 Conclusi</button>
      <button class="tab-btn" onclick="switchTab('UPCOMING', this)">📅 Prossimi</button>
    </div>

    <!-- Griglia Unica -->
    <div class="stremio-grid" id="stremio-grid"></div>

    <div class="infinite-loader" id="loader">⏳ Caricamento altri anime in corso...</div>

  </div>

  <!-- Modal -->
  <div class="modal" id="anime-modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <h2 id="modal-title"></h2>
      <p id="modal-genres" style="color: #94a3b8; font-size: 0.85rem;"></p>
      <p id="modal-description" style="font-size: 0.85rem; color: #cbd5e1; line-height: 1.4;"></p>
    </div>
  </div>

  <script>
    let fetchedAnimeData = [];
    let currentPage = 1;
    let isLoading = false;
    let hasNextPage = true;
    let currentCategory = 'ALL';
    let searchTimeout = null;

    function getAnimeBadge(anime) {
      const hasSequel = anime.relations && anime.relations.edges.some(edge => edge.relationType === 'SEQUEL');

      if (anime.status === 'NOT_YET_RELEASED') {
        return { class: 'badge-purple', label: 'PROSSIMAMENTE', code: 'UPCOMING' };
      }
      if (anime.status === 'RELEASING') {
        return { class: 'badge-blue', label: 'IN CORSO', code: 'AIRING' };
      }
      if (anime.status === 'FINISHED') {
        if (hasSequel) {
          return { class: 'badge-yellow', label: 'SEQUEL CONF.', code: 'READY' };
        }
        return { class: 'badge-green', label: 'STAGIONE FINITA', code: 'READY' };
      }
      return { class: 'badge-red', label: 'CONCLUSA', code: 'ENDED' };
    }

    function fetchAnime(page = 1, searchQuery = "", genre = "", format = "", append = false) {
      if (isLoading || (!hasNextPage && append)) return;
      
      isLoading = true;
      document.getElementById('loader').style.display = 'block';

      let filterArgs = `page: ${page}, perPage: 40, sort: POPULARITY_DESC`;
      
      if (searchQuery) {
        filterArgs = `page: ${page}, perPage: 40, search: "${searchQuery}"`;
      } else {
        if (genre) filterArgs += `, genre: "${genre}"`;
        if (format) filterArgs += `, format: ${format}`;
      }

      const query = `
      query {
        Page(${filterArgs}) {
          pageInfo { hasNextPage }
          media(type: ANIME) {
            id
            title { english romaji }
            coverImage { extraLarge }
            status
            format
            episodes
            genres
            description
            relations { edges { relationType node { id status } } }
          }
        }
      }`;

      fetch('https://graphql.anilist.co', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: query })
      })
      .then(res => res.json())
      .then(data => {
        const pageInfo = data.data.Page.pageInfo;
        const newAnime = data.data.Page.media;

        hasNextPage = pageInfo.hasNextPage;
        fetchedAnimeData = append ? [...fetchedAnimeData, ...newAnime] : newAnime;

        renderGrid();
        isLoading = false;
        document.getElementById('loader').style.display = 'none';
      })
      .catch(() => {
        isLoading = false;
        document.getElementById('loader').style.display = 'none';
      });
    }

    /* Motore di Raccomandazione Smart */
    function getAIRecommendations() {
      const input = document.getElementById('ai-anime-input').value.trim();
      if (!input) return;

      isLoading = true;
      document.getElementById('loader').style.display = 'block';

      // Cerca prima l'ID dell'anime inserito, poi ottieni i consigli correlati
      const query = `
      query {
        Media(search: "${input}", type: ANIME) {
          title { romaji }
          recommendations(perPage: 30) {
            nodes {
              mediaRecommendation {
                id
                title { english romaji }
                coverImage { extraLarge }
                status
                format
                episodes
                genres
                description
                relations { edges { relationType node { id status } } }
              }
            }
          }
        }
      }`;

      fetch('https://graphql.anilist.co', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: query })
      })
      .then(res => res.json())
      .then(data => {
        if (data.data.Media && data.data.Media.recommendations.nodes) {
          const recs = data.data.Media.recommendations.nodes
            .filter(node => node.mediaRecommendation !== null)
            .map(node => node.mediaRecommendation);
          
          fetchedAnimeData = recs;
          renderGrid();
        }
        isLoading = false;
        document.getElementById('loader').style.display = 'none';
      })
      .catch(() => {
        isLoading = false;
        document.getElementById('loader').style.display = 'none';
      });
    }

    function renderGrid() {
      const grid = document.getElementById('stremio-grid');
      grid.innerHTML = '';

      const filtered = fetchedAnimeData.filter(anime => {
        if (currentCategory === 'ALL') return true;
        const badge = getAnimeBadge(anime);
        return badge.code === currentCategory;
      });

      filtered.forEach(anime => {
        const badge = getAnimeBadge(anime);
        const title = anime.title.english || anime.title.romaji;

        const card = document.createElement('div');
        card.className = 'anime-card';
        card.onclick = () => openModal(anime.id);
        card.innerHTML = `
          <div class="poster-container">
            <img class="poster-img" src="${anime.coverImage.extraLarge}" alt="${title}" loading="lazy">
            <div class="status-badge ${badge.class}">${badge.label}</div>
          </div>
          <div class="card-info">
            <div class="anime-title">${title}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function switchTab(category, btnElement) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');
      currentCategory = category;
      renderGrid();
    }

    function handleSearch() {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        currentPage = 1;
        hasNextPage = true;
        const query = document.getElementById('search-input').value.trim();
        fetchAnime(1, query, document.getElementById('genre-select').value, document.getElementById('format-select').value, false);
      }, 500);
    }

    function applyFilters() {
      currentPage = 1;
      hasNextPage = true;
      const searchVal = document.getElementById('search-input').value.trim();
      const genreVal = document.getElementById('genre-select').value;
      const formatVal = document.getElementById('format-select').value;
      fetchAnime(1, searchVal, genreVal, formatVal, false);
    }

    window.addEventListener('scroll', () => {
      if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 800) {
        if (!isLoading && hasNextPage) {
          currentPage++;
          const searchVal = document.getElementById('search-input').value.trim();
          const genreVal = document.getElementById('genre-select').value;
          const formatVal = document.getElementById('format-select').value;
          fetchAnime(currentPage, searchVal, genreVal, formatVal, true);
        }
      }
    });

    function openModal(id) {
      const anime = fetchedAnimeData.find(a => a.id === id);
      if(!anime) return;

      document.getElementById('modal-title').innerText = anime.title.english || anime.title.romaji;
      document.getElementById('modal-genres').innerText = "Generi: " + anime.genres.join(", ");
      document.getElementById('modal-description').innerHTML = anime.description || "Descrizione non disponibile.";
      document.getElementById('anime-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('anime-modal').style.display = 'none';
    }

    fetchAnime(1);
  </script>
</body>
</html>

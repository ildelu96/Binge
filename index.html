<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BINGE 🍿 - Netflix Style</title>
  <style>
    :root {
      --bg-main: #141414;
      --card-bg: #181818;
      --text-main: #ffffff;
      --text-muted: #aaaaaa;
      --netflix-red: #e50914;
      --accent-blue: #00df89;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      padding-bottom: 50px;
      overflow-x: hidden;
    }

    header {
      background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
      padding: 15px 4%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      transition: background 0.3s;
    }

    header.scrolled { background: #141414; }

    .logo {
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--netflix-red);
      letter-spacing: 1.5px;
    }

    .menu-container { position: relative; }

    .menu-btn {
      background: rgba(0,0,0,0.6);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.3);
      padding: 6px 14px;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      right: 0; top: 40px;
      background: #000;
      border: 1px solid #333;
      border-radius: 4px;
      width: 200px;
      z-index: 110;
    }

    .dropdown-menu.show { display: block; }

    .dropdown-item {
      padding: 12px 15px;
      font-size: 0.85rem;
      color: #fff;
      cursor: pointer;
      border-bottom: 1px solid #222;
    }
    .dropdown-item:hover { background: #222; }

    /* Search & Tools Section */
    .controls-container {
      margin-top: 80px;
      padding: 0 4%;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1;
      min-width: 200px;
      padding: 10px 15px;
      background: #222;
      border: 1px solid #444;
      color: #fff;
      border-radius: 4px;
      outline: none;
    }

    /* Netflix Rows Layout */
    .row-container {
      margin-top: 25px;
      padding: 0 0 0 4%;
    }

    .row-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 10px;
      color: #e5e5e5;
    }

    .row-posters {
      display: flex;
      overflow-x: auto;
      overflow-y: hidden;
      gap: 10px;
      padding-bottom: 15px;
      scroll-behavior: smooth;
    }

    .row-posters::-webkit-scrollbar { height: 6px; }
    .row-posters::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

    .netflix-card {
      flex: 0 0 auto;
      width: 140px;
      position: relative;
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s;
      background: var(--card-bg);
    }

    @media (min-width: 768px) {
      .netflix-card { width: 180px; }
    }

    .netflix-card:hover { transform: scale(1.05); z-index: 10; }

    .netflix-card img {
      width: 100%;
      height: 210px;
      object-fit: cover;
      display: block;
    }

    @media (min-width: 768px) {
      .netflix-card img { height: 260px; }
    }

    .rank-number {
      position: absolute;
      bottom: -10px; left: -5px;
      font-size: 3.5rem;
      font-weight: 900;
      color: #000;
      -webkit-text-stroke: 2px var(--netflix-red);
      line-height: 1;
      pointer-events: none;
    }

    .card-title {
      padding: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Modal */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); z-index: 200;
      justify-content: center; align-items: center; padding: 20px;
    }

    .modal-content {
      background: #181818; color: #fff; width: 100%; max-width: 550px;
      border-radius: 8px; padding: 20px; max-height: 85vh; overflow-y: auto;
    }

    .close-btn { float: right; font-size: 1.5rem; cursor: pointer; color: #aaa; }

    .action-btn {
      width: 100%; margin-top: 15px; padding: 12px;
      background: var(--netflix-red); color: #fff;
      border: none; border-radius: 4px; font-weight: 700; cursor: pointer;
    }
  </style>
</head>
<body>

  <header id="header">
    <div class="logo">BINGE</div>
    <div class="menu-container">
      <button class="menu-btn" onclick="toggleMenu()">⚙️ Menù ▼</button>
      <div class="dropdown-menu" id="dropdown-menu">
        <div class="dropdown-item" onclick="exportHistory()">📥 Esporta Cronologia</div>
        <div class="dropdown-item" onclick="triggerImport()">📤 Importa Cronologia</div>
        <div class="dropdown-item" onclick="showSavedList()">📜 La Mia Lista</div>
        <div class="dropdown-item" onclick="location.reload()">🏠 Home</div>
      </div>
    </div>
  </header>

  <input type="file" id="import-file" style="display:none" onchange="importHistory(event)">

  <div class="controls-container">
    <input type="text" id="search-input" class="search-input" placeholder="🔍 Cerca anime su Netflix style..." oninput="handleSearch()">
  </div>

  <div id="searchResultsSection" class="row-container" style="display:none;">
    <div class="row-title">Risultati Ricerca</div>
    <div class="row-posters" id="search-grid"></div>
  </div>

  <div id="mainRows">
    <div class="row-container">
      <div class="row-title">🏆 Top 10 Italia</div>
      <div class="row-posters" id="row-top-ita"></div>
    </div>

    <div class="row-container">
      <div class="row-title">🌍 Top 10 Mondo</div>
      <div class="row-posters" id="row-top-world"></div>
    </div>

    <div class="row-container">
      <div class="row-title">🔥 I Popolari</div>
      <div class="row-posters" id="row-popular"></div>
    </div>

    <div class="row-container">
      <div class="row-title">⚡ In Tendenza</div>
      <div class="row-posters" id="row-trending"></div>
    </div>
  </div>

  <div class="modal" id="anime-modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <h2 id="modal-title" style="margin-bottom: 10px;"></h2>
      <p id="modal-description" style="font-size: 0.85rem; color: #ccc; line-height: 1.4;"></p>
      <button class="action-btn" id="save-btn" onclick="toggleSaveAnime()">➕ Aggiungi alla Mia Lista</button>
    </div>
  </div>

  <script>
    let savedList = JSON.parse(localStorage.getItem('binge_saved') || '[]');
    let currentAnimeData = [];
    let selectedAnimeId = null;
    let searchTimeout = null;

    window.onscroll = () => {
      document.getElementById('header').classList.toggle('scrolled', window.scrollY > 50);
    };

    function toggleMenu() {
      document.getElementById('dropdown-menu').classList.toggle('show');
    }

    async function fetchKitsuCategory(queryUrl, elementId, isRanked = false) {
      try {
        const res = await fetch(queryUrl);
        const data = await res.json();
        const items = data.data || [];

        const container = document.getElementById(elementId);
        container.innerHTML = '';

        items.forEach((item, index) => {
          const anime = {
            id: item.id,
            title: item.attributes.canonicalTitle,
            coverImage: item.attributes.posterImage?.small || item.attributes.posterImage?.original,
            synopsis: item.attributes.synopsis || "Nessuna descrizione disponibile."
          };

          currentAnimeData.push(anime);

          const card = document.createElement('div');
          card.className = 'netflix-card';
          card.onclick = () => openModal(anime.id);
          card.innerHTML = `
            <img src="${anime.coverImage}" alt="${anime.title}" loading="lazy">
            ${isRanked ? `<div class="rank-number">${index + 1}</div>` : ''}
            <div class="card-title">${anime.title}</div>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        console.error("Errore nel caricamento:", err);
      }
    }

    function initNetflixHome() {
      currentAnimeData = [];
      // Top 10 Italia (Popolari popolari)
      fetchKitsuCategory('https://kitsu.io/api/edge/anime?page[limit]=10&sort=-user_count', 'row-top-ita', true);
      // Top 10 Mondo (Punteggio più alto)
      fetchKitsuCategory('https://kitsu.io/api/edge/anime?page[limit]=10&sort=-average_rating', 'row-top-world', true);
      // I Popolari
      fetchKitsuCategory('https://kitsu.io/api/edge/anime?page[limit]=15&sort=popularityRank', 'row-popular');
      // In Tendenza
      fetchKitsuCategory('https://kitsu.io/api/edge/anime?page[limit]=15&sort=-kitsu_score', 'row-trending');
    }

    function handleSearch() {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(async () => {
        const query = document.getElementById('search-input').value.trim();
        const searchSection = document.getElementById('searchResultsSection');
        const mainRows = document.getElementById('mainRows');

        if (!query) {
          searchSection.style.display = 'none';
          mainRows.style.display = 'block';
          return;
        }

        searchSection.style.display = 'block';
        mainRows.style.display = 'none';

        fetchKitsuCategory(`https://kitsu.io/api/edge/anime?filter[text]=${encodeURIComponent(query)}&page[limit]=20`, 'search-grid');
      }, 400);
    }

    function openModal(id) {
      const anime = currentAnimeData.find(a => a.id === id);
      if (!anime) return;

      selectedAnimeId = id;
      document.getElementById('modal-title').innerText = anime.title;
      document.getElementById('modal-description').innerText = anime.synopsis;

      const isSaved = savedList.some(item => item.id === id);
      document.getElementById('save-btn').innerText = isSaved ? "❌ Rimuovi dalla Lista" : "➕ Aggiungi alla Mia Lista";

      document.getElementById('anime-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('anime-modal').style.display = 'none';
    }

    function toggleSaveAnime() {
      const anime = currentAnimeData.find(a => a.id === selectedAnimeId);
      if (!anime) return;

      const index = savedList.findIndex(item => item.id === selectedAnimeId);
      if (index > -1) {
        savedList.splice(index, 1);
        document.getElementById('save-btn').innerText = "➕ Aggiungi alla Mia Lista";
      } else {
        savedList.push(anime);
        document.getElementById('save-btn').innerText = "❌ Rimuovi dalla Lista";
      }
      localStorage.setItem('binge_saved', JSON.stringify(savedList));
    }

    // --- Gestione Esportazione / Importazione Cronologia ---
    function exportHistory() {
      if (savedList.length === 0) {
        alert("Nessun anime salvato da esportare.");
        return;
      }
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(savedList, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "cronologia_binge.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function triggerImport() {
      document.getElementById('import-file').click();
    }

    function importHistory(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (Array.isArray(imported)) {
            savedList = imported;
            localStorage.setItem('binge_saved', JSON.stringify(savedList));
            alert("✅ Cronologia importata con successo!");
          }
        } catch (err) {
          alert("❌ File non valido.");
        }
      };
      reader.readAsText(file);
    }

    function showSavedList() {
      document.getElementById('mainRows').style.display = 'none';
      const searchSection = document.getElementById('searchResultsSection');
      searchSection.style.display = 'block';
      
      const container = document.getElementById('search-grid');
      container.innerHTML = '';

      if (savedList.length === 0) {
        container.innerHTML = '<div style="padding: 20px;">La tua lista è vuota.</div>';
        return;
      }

      savedList.forEach(anime => {
        currentAnimeData.push(anime);
        const card = document.createElement('div');
        card.className = 'netflix-card';
        card.onclick = () => openModal(anime.id);
        card.innerHTML = `
          <img src="${anime.coverImage}" alt="${anime.title}">
          <div class="card-title">${anime.title}</div>
        `;
        container.appendChild(card);
      });
      toggleMenu();
    }

    // Avvio Istantaneo
    initNetflixHome();
  </script>
</body>
</html>

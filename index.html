<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BINGE 🍿</title>
  <style>
    :root {
      --bg-main: #0f172a;
      --card-bg: #1e293b;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --badge-blue: #0284c7;    
      --badge-green: #10b981;   
      --badge-purple: #a855f7;
      --badge-red: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      padding-bottom: 50px;
      overflow-x: hidden;
    }

    /* HEADER */
    header {
      background: rgba(15, 23, 42, 0.95);
      padding: 15px 4%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .logo {
      font-size: 1.6rem; font-weight: 900; color: var(--accent-blue);
      letter-spacing: 1.5px; cursor: pointer;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .notif-btn {
      position: relative;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .notif-badge {
      position: absolute;
      top: -6px; right: -6px;
      background: var(--badge-red);
      color: #fff;
      font-size: 0.65rem;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 10px;
      display: none;
    }

    .menu-container { position: relative; }
    .menu-btn {
      background: rgba(30, 41, 59, 0.8); color: #fff;
      border: 1px solid rgba(56, 189, 248, 0.4);
      padding: 8px 16px; border-radius: 6px; font-size: 0.85rem;
      font-weight: 600; cursor: pointer;
    }

    .dropdown-menu {
      display: none; position: absolute; right: 0; top: 45px;
      background: #1e293b; border: 1px solid #334155; border-radius: 6px;
      width: 220px; z-index: 110; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
    }
    .dropdown-menu.show { display: block; }
    .dropdown-item {
      padding: 12px 15px; font-size: 0.85rem; color: #fff;
      cursor: pointer; border-bottom: 1px solid #334155;
    }
    .dropdown-item:hover { background: #334155; }

    /* CONTROLS BAR */
    .controls-container {
      margin-top: 85px; padding: 0 4%; display: flex; gap: 10px; flex-wrap: wrap;
    }
    .search-input, .year-select {
      padding: 10px 15px; background: #1e293b; border: 1px solid #334155;
      color: #fff; border-radius: 6px; outline: none;
    }
    .search-input { flex: 1; min-width: 200px; }

    /* LAYOUT HOME */
    .row-container { margin-top: 25px; padding: 0 0 0 4%; }
    .row-title {
      font-size: 1.2rem; font-weight: 700; margin-bottom: 10px; color: #ffffff;
      display: flex; align-items: center; justify-content: space-between; padding-right: 4%;
    }
    .row-posters {
      display: flex; overflow-x: auto; overflow-y: hidden; gap: 12px;
      padding-bottom: 15px; scroll-behavior: smooth;
    }
    .row-posters::-webkit-scrollbar { height: 6px; }
    .row-posters::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

    /* CARDS */
    .netflix-card {
      flex: 0 0 auto; width: 140px; position: relative; border-radius: 6px;
      overflow: hidden; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
      background: var(--card-bg); border: 1px solid #334155;
    }
    @media (min-width: 768px) { .netflix-card { width: 170px; } }
    .netflix-card:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.4); z-index: 10; }
    .netflix-card img { width: 100%; height: 210px; object-fit: cover; display: block; }
    @media (min-width: 768px) { .netflix-card img { height: 250px; } }

    .status-badge {
      position: absolute; top: 6px; right: 6px; padding: 3px 6px;
      border-radius: 4px; font-size: 0.55rem; font-weight: 800; color: #fff;
      text-transform: uppercase; box-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }
    .badge-blue { background: var(--badge-blue); }
    .badge-green { background: var(--badge-green); }
    .badge-purple { background: var(--badge-purple); }

    .card-title {
      padding: 8px 6px; font-size: 0.75rem; font-weight: 600; color: #ffffff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center;
    }

    /* PANNELLO NOTIFICHE */
    .notif-drawer {
      display: none; position: fixed; top: 65px; right: 4%; width: 340px; max-width: 90vw;
      background: #1e293b; border: 1px solid #334155; border-radius: 8px;
      z-index: 150; box-shadow: 0 10px 25px rgba(0,0,0,0.5); padding: 15px;
      max-height: 450px; overflow-y: auto;
    }
    .notif-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px; border-bottom: 1px solid #334155; padding-bottom: 8px;
    }
    .notif-item {
      background: #0f172a; padding: 10px; border-radius: 6px; margin-bottom: 8px;
      border-left: 4px solid var(--accent-blue); font-size: 0.82rem; cursor: pointer;
    }
    .notif-item.unread { border-left-color: var(--badge-red); background: #1a233a; }
    .notif-item-title { font-weight: bold; margin-bottom: 4px; color: #fff; }
    .notif-item-desc { color: #cbd5e1; margin-bottom: 4px; }
    .notif-item-date { font-size: 0.7rem; color: #94a3b8; }

    /* AUTH MODAL */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(6px); z-index: 200;
      justify-content: center; align-items: center; padding: 20px;
    }
    .modal-content {
      background: #1e293b; color: #fff; width: 100%; max-width: 350px;
      border-radius: 8px; padding: 20px; border: 1px solid #334155; text-align: center;
    }
    .close-btn { float: right; font-size: 1.5rem; cursor: pointer; color: #94a3b8; }
    .auth-input { width: 100%; margin-bottom: 15px; }
    .error-msg { color: #ef4444; font-size: 0.85rem; margin-bottom: 10px; display: none; }

    /* BOTTONI GLOBALI */
    .action-btn {
      width: 100%; padding: 12px; background: var(--badge-blue); color: #fff;
      border: none; border-radius: 6px; font-weight: 700; cursor: pointer;
      transition: background 0.2s; margin-top: 10px;
    }
    .action-btn:hover { background: var(--accent-blue); }
    .btn-secondary { background: #334155; }
    .btn-secondary:hover { background: #475569; }

    /* LAYOUT PAGINA DETTAGLI */
    #view-details { display: none; padding: 85px 4% 40px 4%; }
    .back-btn {
      background: transparent; color: var(--accent-blue); border: 1px solid var(--accent-blue);
      padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold;
      display: inline-flex; align-items: center; gap: 8px; margin-bottom: 20px;
    }
    .back-btn:hover { background: rgba(56, 189, 248, 0.1); }
    
    .details-grid { display: flex; flex-direction: column; gap: 25px; }
    @media(min-width: 768px) {
      .details-grid { flex-direction: row; align-items: flex-start; }
      .details-poster-area { width: 280px; flex-shrink: 0; position: sticky; top: 90px; }
    }
    
    .details-poster-area img { width: 100%; border-radius: 8px; border: 1px solid #334155; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
    .details-info-area { flex: 1; }
    .details-title { font-size: 2rem; margin-bottom: 10px; }
    
    .details-meta { display: flex; gap: 15px; font-size: 0.9rem; color: var(--accent-blue); font-weight: 700; margin-bottom: 15px; }
    .genres-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
    .genre-tag { background: #334155; color: #f8fafc; font-size: 0.75rem; padding: 4px 10px; border-radius: 12px; font-weight: 600; }
    
    .details-desc { font-size: 0.95rem; color: #cbd5e1; line-height: 1.6; margin-bottom: 30px; }
    
    .episodes-container { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
    .episode-card { background: #1e293b; padding: 15px; border-radius: 8px; border: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .ep-title { font-weight: bold; color: #fff; }
    .ep-date { font-size: 0.8rem; color: #94a3b8; }

  </style>
</head>
<body>

  <!-- HEADER GLOBALE -->
  <header id="header">
    <div class="logo" onclick="goHome()">BINGE</div>
    <div class="header-actions">
      <!-- TASTO NOTIFICHE -->
      <button class="notif-btn" onclick="toggleNotifications()" title="Notifiche">
        🔔 <span class="notif-badge" id="notif-count">0</span>
      </button>

      <div class="menu-container">
        <button class="menu-btn" onclick="toggleMenu()" id="main-menu-btn">👤 Accedi ▼</button>
        <div class="dropdown-menu" id="dropdown-menu">
          <div id="auth-menu-items"></div>
          <div style="border-top: 1px solid #334155; margin-top: 5px; padding-top: 5px;">
            <div class="dropdown-item" onclick="goHome()">🏠 Home / Refresh</div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- DRAWER NOTIFICHE -->
  <div class="notif-drawer" id="notif-drawer">
    <div class="notif-header">
      <h3 style="font-size:1rem; color:#fff;">🔔 Notifiche Preferiti</h3>
      <span style="font-size:0.75rem; color:var(--accent-blue); cursor:pointer;" onclick="clearAllNotifications()">Svuota</span>
    </div>
    <div id="notif-list-container">
      <div style="color:#94a3b8; font-size:0.85rem; text-align:center; padding:15px;">Nessuna nuova notifica.</div>
    </div>
  </div>

  <input type="file" id="import-file" style="display:none" onchange="importHistory(event)">

  <!-- ==================== VISTA HOME ==================== -->
  <div id="view-home">
    <div class="controls-container">
      <input type="text" id="search-input" class="search-input" placeholder="🔍 Cerca qualsiasi anime..." oninput="handleSearch()">
      
      <select id="year-select" class="year-select" onchange="filterByYear()">
        <option value="">📅 Cerca per Annata</option>
        <option value="2020..2026">Anni 2020+</option>
        <option value="2010..2019">Anni 2010-2019</option>
        <option value="2000..2009">Anni 2000-2009</option>
      </select>
    </div>

    <!-- Risultati Ricerca -->
    <div id="searchResultsSection" class="row-container" style="display:none;">
      <div class="row-title" id="search-title">Risultati</div>
      <div class="row-posters" id="search-grid" style="flex-wrap: wrap; overflow-x: visible;"></div>
    </div>

    <div id="mainRows">
      <!-- Preferiti -->
      <div class="row-container">
        <div class="row-title"><span id="favorites-title">❤️ I Tuoi Preferiti</span></div>
        <div class="row-posters" id="row-favorites"></div>
      </div>

      <!-- Nuove Uscite -->
      <div class="row-container">
        <div class="row-title">🌟 Nuove Uscite</div>
        <div class="row-posters" id="row-new-releases"></div>
      </div>

      <!-- Consigliati -->
      <div class="row-container">
        <div class="row-title">🤖 Consigliati per Te</div>
        <div class="row-posters" id="row-ai-recommendations"></div>
      </div>

      <!-- Popolari -->
      <div class="row-container">
        <div class="row-title">🔥 I Popolari del Momento</div>
        <div class="row-posters" id="row-top-ita"></div>
      </div>
    </div>
  </div>

  <!-- ==================== VISTA DETTAGLI (PAGINA INTERA) ==================== -->
  <div id="view-details">
    <button class="back-btn" onclick="goHome()">⬅ Torna Indietro</button>
    
    <div class="details-grid">
      <!-- Colonna Sinistra: Locandina e Azioni -->
      <div class="details-poster-area">
        <img id="detail-poster" src="" alt="Locandina">
        <button class="action-btn" id="save-btn" onclick="toggleSaveAnime()">➕ Aggiungi ai Preferiti</button>
        <button class="action-btn btn-secondary" style="font-size:0.75rem;" onclick="simulateNotification()">🔔 Testa Notifica Simulata</button>
      </div>

      <!-- Colonna Destra: Info e Puntate -->
      <div class="details-info-area">
        <h1 class="details-title" id="detail-title">Nome Anime</h1>
        <div class="details-meta">
          <span id="detail-episodes">📺 -- Episodi</span>
          <span id="detail-status">🟢 Status</span>
        </div>
        <div class="genres-list" id="detail-genres"></div>
        <p class="details-desc" id="detail-description">Descrizione...</p>
        
        <div>
          <h2 style="font-size: 1.3rem; margin-bottom: 10px; border-bottom: 1px solid #334155; padding-bottom: 10px;">📜 Elenco Puntate</h2>
          <div class="episodes-container" id="detail-episodes-list">
            <!-- Popolato da JS -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL AUTENTICAZIONE -->
  <div class="modal" id="auth-modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeAuthModal()">&times;</span>
      <h2 style="margin-bottom: 20px;">Accedi a BINGE</h2>
      <div id="auth-error" class="error-msg">Credenziali errate.</div>
      <input type="text" id="auth-username" placeholder="Username" class="search-input auth-input">
      <input type="password" id="auth-password" placeholder="Password" class="search-input auth-input">
      <button class="action-btn" onclick="handleLogin()">🔑 Accedi</button>
      <button class="action-btn btn-secondary" onclick="handleRegister()">📝 Crea nuovo Account</button>
    </div>
  </div>

  <script>
    // --- DATABASE LOCALE E UTENTI ---
    let currentUser = localStorage.getItem('binge_current_user') || null;
    let usersDb = JSON.parse(localStorage.getItem('binge_users_db') || '{}');
    let savedList = []; 
    let userNotifications = [];
    let currentAnimeData = [];
    let selectedAnimeId = null;
    let searchTimeout = null;

    // --- NAVIGAZIONE VISTE ---
    function goHome() {
      document.getElementById('view-details').style.display = 'none';
      document.getElementById('view-home').style.display = 'block';
      document.getElementById('notif-drawer').style.display = 'none';
      window.scrollTo(0,0);
    }
    
    function showDetailsPage() {
      document.getElementById('view-home').style.display = 'none';
      document.getElementById('view-details').style.display = 'block';
      document.getElementById('notif-drawer').style.display = 'none';
      window.scrollTo(0,0);
    }

    function toggleMenu() { document.getElementById('dropdown-menu').classList.toggle('show'); }

    // --- SISTEMA AUTENTICAZIONE & SESSIONE ---
    function initUserSession() {
      if (currentUser) {
        savedList = JSON.parse(localStorage.getItem(`binge_saved_${currentUser}`) || '[]');
        userNotifications = JSON.parse(localStorage.getItem(`binge_notifs_${currentUser}`) || '[]');
        
        document.getElementById('main-menu-btn').innerText = `👤 ${currentUser} ▼`;
        document.getElementById('favorites-title').innerText = `❤️ Preferiti di ${currentUser}`;
        document.getElementById('auth-menu-items').innerHTML = `
          <div class="dropdown-item" onclick="exportHistory()">📥 Esporta Preferiti</div>
          <div class="dropdown-item" onclick="triggerImport()">📤 Importa Preferiti</div>
          <div class="dropdown-item" style="color: #ef4444;" onclick="logout()">🚪 Esci (Logout)</div>
        `;
        checkFavoritesUpdates();
      } else {
        savedList = [];
        userNotifications = [];
        document.getElementById('main-menu-btn').innerText = `🔒 Accedi ▼`;
        document.getElementById('favorites-title').innerText = `❤️ I Tuoi Preferiti (Accedi per salvare)`;
        document.getElementById('auth-menu-items').innerHTML = `<div class="dropdown-item" onclick="openAuthModal()">🔑 Accedi / Registrati</div>`;
      }
      renderNotifications();
      initNetflixHome();
    }

    function openAuthModal() {
      document.getElementById('dropdown-menu').classList.remove('show');
      document.getElementById('auth-error').style.display = 'none';
      document.getElementById('auth-modal').style.display = 'flex';
    }
    function closeAuthModal() { document.getElementById('auth-modal').style.display = 'none'; }

    function handleRegister() {
      const user = document.getElementById('auth-username').value.trim();
      const pass = document.getElementById('auth-password').value.trim();
      if (!user || !pass) return showAuthError("Inserisci Username e Password.");
      if (usersDb[user]) return showAuthError("Username già in uso.");
      usersDb[user] = { password: pass };
      localStorage.setItem('binge_users_db', JSON.stringify(usersDb));
      performLogin(user);
    }

    function handleLogin() {
      const user = document.getElementById('auth-username').value.trim();
      const pass = document.getElementById('auth-password').value.trim();
      if (usersDb[user] && usersDb[user].password === pass) performLogin(user);
      else showAuthError("Username o Password errati.");
    }

    function performLogin(user) {
      currentUser = user; localStorage.setItem('binge_current_user', currentUser);
      closeAuthModal(); initUserSession();
    }

    function logout() {
      currentUser = null; localStorage.removeItem('binge_current_user'); goHome(); initUserSession();
    }

    function showAuthError(msg) {
      const errEl = document.getElementById('auth-error');
      errEl.innerText = msg; errEl.style.display = 'block';
    }

    // --- SISTEMA NOTIFICHE ---
    function toggleNotifications() {
      const drawer = document.getElementById('notif-drawer');
      drawer.style.display = drawer.style.display === 'block' ? 'none' : 'block';
    }

    function addNotification(animeTitle, message, type = 'info', animeId = null) {
      if (!currentUser) return;
      const notif = {
        id: Date.now(),
        animeTitle,
        message,
        type,
        animeId,
        date: new Date().toLocaleDateString('it-IT') + ' ' + new Date().toLocaleTimeString('it-IT', {hour: '2-digit', minute:'2-digit'}),
        unread: true
      };
      userNotifications.unshift(notif);
      localStorage.setItem(`binge_notifs_${currentUser}`, JSON.stringify(userNotifications));
      renderNotifications();
    }

    function renderNotifications() {
      const countBadge = document.getElementById('notif-count');
      const container = document.getElementById('notif-list-container');
      
      const unreadCount = userNotifications.filter(n => n.unread).length;
      if (unreadCount > 0) {
        countBadge.innerText = unreadCount;
        countBadge.style.display = 'block';
      } else {
        countBadge.style.display = 'none';
      }

      if (userNotifications.length === 0) {
        container.innerHTML = '<div style="color:#94a3b8; font-size:0.85rem; text-align:center; padding:15px;">Nessuna notifica presente.</div>';
        return;
      }

      container.innerHTML = '';
      userNotifications.forEach(n => {
        const item = document.createElement('div');
        item.className = `notif-item ${n.unread ? 'unread' : ''}`;
        item.onclick = () => {
          n.unread = false;
          localStorage.setItem(`binge_notifs_${currentUser}`, JSON.stringify(userNotifications));
          renderNotifications();
          if (n.animeId) openDetails(n.animeId);
        };
        item.innerHTML = `
          <div class="notif-item-title">${n.animeTitle}</div>
          <div class="notif-item-desc">${n.message}</div>
          <div class="notif-item-date">${n.date}</div>
        `;
        container.appendChild(item);
      });
    }

    function clearAllNotifications() {
      if (!currentUser) return;
      userNotifications = [];
      localStorage.setItem(`binge_notifs_${currentUser}`, JSON.stringify(userNotifications));
      renderNotifications();
    }

    // Monitora lo stato dei preferiti per creare notifiche automatiche
    async function checkFavoritesUpdates() {
      if (!currentUser || savedList.length === 0) return;

      for (let anime of savedList) {
        try {
          const res = await fetch(`https://kitsu.io/api/edge/anime/${anime.id}`);
          const data = await res.json();
          if (!data.data) continue;
          
          const newStatus = data.data.attributes.status;
          const oldStatus = anime.status;

          if (oldStatus !== newStatus) {
            anime.status = newStatus;
            let msg = "";
            if (newStatus === 'current') msg = "🚀 Nuova Stagione in onda!";
            else if (newStatus === 'finished') msg = "🏁 La Stagione si è conclusa!";
            else if (newStatus === 'upcoming') msg = "📢 Nuova Stagione confermata / In arrivo!";
            
            if (msg) addNotification(anime.title, msg, 'status_change', anime.id);
          }
        } catch(e) {}
      }
      localStorage.setItem(`binge_saved_${currentUser}`, JSON.stringify(savedList));
    }

    function simulateNotification() {
      const anime = currentAnimeData.find(a => a.id === selectedAnimeId);
      if (!anime) return;
      const types = [
        "🚀 È iniziata la Nuova Stagione!",
        "🏁 Si è appena conclusa l'ultima stagione!",
        "📢 Ufficialmente confermata una Nuova Stagione!"
      ];
      const randomMsg = types[Math.floor(Math.random() * types.length)];
      addNotification(anime.title, randomMsg, 'simulated', anime.id);
      alert("🔔 Notifica inviata! Controlla la campanella in alto.");
    }

    // --- CARICAMENTO ANIME & HOME ---
    function getAnimeBadge(status) {
      const st = (status || '').toLowerCase();
      if (st.includes('current') || st.includes('airing')) return { class: 'badge-blue', label: 'IN CORSO' };
      if (st.includes('upcoming') || st.includes('unreleased')) return { class: 'badge-purple', label: 'IN ARRIVO' };
      return { class: 'badge-green', label: 'COMPLETO' };
    }

    async function fetchKitsuCategory(queryUrl, elementId) {
      try {
        const res = await fetch(queryUrl);
        const data = await res.json();
        const items = data.data || [];
        const container = document.getElementById(elementId);
        if (!container) return;
        container.innerHTML = '';

        if (items.length === 0) {
          container.innerHTML = '<div style="color:#94a3b8; font-size:0.85rem; padding:10px;">Nessun anime trovato.</div>';
          return;
        }

        items.forEach((item) => {
          const epCount = item.attributes.episodeCount ? `${item.attributes.episodeCount} Ep.` : 'In corso';
          const anime = {
            id: item.id.toString(),
            title: item.attributes.canonicalTitle,
            coverImage: item.attributes.posterImage?.small || item.attributes.posterImage?.original,
            synopsis: item.attributes.synopsis || "Nessuna descrizione disponibile.",
            episodes: epCount,
            status: item.attributes.status
          };

          if(!currentAnimeData.find(a => a.id === anime.id)) currentAnimeData.push(anime);
          
          const badge = getAnimeBadge(anime.status);
          const card = document.createElement('div');
          card.className = 'netflix-card';
          card.onclick = () => openDetails(anime.id);
          card.innerHTML = `
            <img src="${anime.coverImage}" alt="${anime.title}" loading="lazy">
            <div class="status-badge ${badge.class}">${badge.label}</div>
            <div class="card-title">${anime.title}</div>
          `;
          container.appendChild(card);
        });
      } catch (err) { console.error("Errore:", err); }
    }

    function renderFavoritesRow() {
      const container = document.getElementById('row-favorites');
      container.innerHTML = '';
      if (!currentUser) {
        container.innerHTML = '<div style="color:#94a3b8; font-size:0.85rem; padding:10px; cursor:pointer;" onclick="openAuthModal()">⚠️ Accedi per salvare i preferiti.</div>';
        return;
      }
      if (savedList.length === 0) {
        container.innerHTML = '<div style="color:#94a3b8; font-size:0.85rem; padding:10px;">Ancora nessun anime salvato nei preferiti.</div>';
        return;
      }
      savedList.forEach(anime => {
        if(!currentAnimeData.find(a => a.id === anime.id)) currentAnimeData.push(anime);
        const badge = getAnimeBadge(anime.status);
        const card = document.createElement('div');
        card.className = 'netflix-card';
        card.onclick = () => openDetails(anime.id);
        card.innerHTML = `
          <img src="${anime.coverImage}" alt="${anime.title}">
          <div class="status-badge ${badge.class}">${badge.label}</div>
          <div class="card-title">${anime.title}</div>
        `;
        container.appendChild(card);
      });
    }

    function initNetflixHome() {
      currentAnimeData = [];
      renderFavoritesRow();
      
      // Nuove Uscite
      fetchKitsuCategory('https://kitsu.io/api/edge/anime?filter[status]=current&sort=-startDate&page[limit]=15', 'row-new-releases');
      
      if (savedList.length > 0) {
        const keyword = encodeURIComponent(savedList[savedList.length - 1].title.split(' ')[0]);
        fetchKitsuCategory(`https://kitsu.io/api/edge/anime?filter[text]=${keyword}&page[limit]=10`, 'row-ai-recommendations');
      } else {
        fetchKitsuCategory('https://kitsu.io/api/edge/anime?page[limit]=10&sort=-average_rating', 'row-ai-recommendations');
      }
      fetchKitsuCategory('https://kitsu.io/api/edge/anime?page[limit]=15&sort=popularityRank', 'row-top-ita');
    }

    // --- RICERCA E FILTRI ---
    function handleSearch() {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        const query = document.getElementById('search-input').value.trim();
        document.getElementById('year-select').value = '';
        const searchSection = document.getElementById('searchResultsSection');
        const mainRows = document.getElementById('mainRows');
        if (!query) { searchSection.style.display = 'none'; mainRows.style.display = 'block'; return; }
        
        searchSection.style.display = 'block'; mainRows.style.display = 'none';
        document.getElementById('search-title').innerText = `Risultati Ricerca: "${query}"`;
        fetchKitsuCategory(`https://kitsu.io/api/edge/anime?filter[text]=${encodeURIComponent(query)}&page[limit]=20`, 'search-grid');
      }, 400);
    }

    function filterByYear() {
      const year = document.getElementById('year-select').value;
      if (!year) { document.getElementById('searchResultsSection').style.display = 'none'; document.getElementById('mainRows').style.display = 'block'; return; }
      document.getElementById('searchResultsSection').style.display = 'block'; document.getElementById('mainRows').style.display = 'none';
      document.getElementById('search-title').innerText = `Anime per Annata (${year})`;
      fetchKitsuCategory(`https://kitsu.io/api/edge/anime?filter[seasonYear]=${year}&page[limit]=20&sort=-user_count`, 'search-grid');
    }

    // --- DETTAGLIO FULL PAGE ---
    function openDetails(id) {
      const anime = currentAnimeData.find(a => a.id === id);
      if (!anime) return;

      selectedAnimeId = id;
      document.getElementById('detail-title').innerText = anime.title;
      document.getElementById('detail-poster').src = anime.coverImage;
      document.getElementById('detail-episodes').innerText = `📺 Puntate: ${anime.episodes || 'N.D.'}`;
      document.getElementById('detail-status').innerText = `🟢 Stato: ${(anime.status || 'N.D.').toUpperCase()}`;
      document.getElementById('detail-description').innerText = anime.synopsis;

      const saveBtn = document.getElementById('save-btn');
      if (!currentUser) {
        saveBtn.innerText = "🔒 Accedi per Salvare";
        saveBtn.onclick = () => { openAuthModal(); };
      } else {
        const isSaved = savedList.some(item => item.id === id);
        saveBtn.innerText = isSaved ? "❌ Rimuovi dai Preferiti" : "➕ Aggiungi ai Preferiti";
        saveBtn.onclick = toggleSaveAnime;
      }

      showDetailsPage();
      loadKitsuGenres(id);
      loadKitsuEpisodes(id);
    }

    async function loadKitsuGenres(id) {
      try {
        const res = await fetch(`https://kitsu.io/api/edge/anime/${id}/categories`);
        const data = await res.json();
        const container = document.getElementById('detail-genres');
        container.innerHTML = '';
        if (data.data) {
          data.data.slice(0, 5).forEach(c => {
            const t = document.createElement('span'); t.className = 'genre-tag'; t.innerText = c.attributes.title; container.appendChild(t);
          });
        }
      } catch (e) {}
    }

    async function loadKitsuEpisodes(id) {
      const container = document.getElementById('detail-episodes-list');
      container.innerHTML = '<div style="color:#fff;">Ricerca puntate in corso...</div>';
      try {
        const res = await fetch(`https://kitsu.io/api/edge/anime/${id}/episodes?page[limit]=50`);
        const data = await res.json();
        container.innerHTML = '';
        if (!data.data || data.data.length === 0) { container.innerHTML = '<div class="episode-card">Nessuna puntata indicizzata.</div>'; return; }

        data.data.forEach(ep => {
          const num = ep.attributes.number || '-';
          const title = ep.attributes.canonicalTitle || `Episodio ${num}`;
          const date = ep.attributes.airdate ? new Date(ep.attributes.airdate).toLocaleDateString('it-IT') : 'N.D.';
          container.innerHTML += `<div class="episode-card"><span class="ep-title">Ep. ${num}: ${title}</span><span class="ep-date">📅 ${date}</span></div>`;
        });
      } catch (e) { container.innerHTML = '<div style="color:red;">Errore nel caricamento puntate.</div>'; }
    }

    function toggleSaveAnime() {
      if (!currentUser) return;
      const anime = currentAnimeData.find(a => a.id === selectedAnimeId);
      if (!anime) return;

      const index = savedList.findIndex(item => item.id === selectedAnimeId);
      if (index > -1) {
        savedList.splice(index, 1);
        document.getElementById('save-btn').innerText = "➕ Aggiungi ai Preferiti";
      } else {
        savedList.push(anime);
        document.getElementById('save-btn').innerText = "❌ Rimuovi dai Preferiti";
        addNotification(anime.title, "➕ Aggiunto ai tuoi anime preferiti!", 'favorite_add', anime.id);
      }
      localStorage.setItem(`binge_saved_${currentUser}`, JSON.stringify(savedList));
      renderFavoritesRow();
    }

    // --- IMPORT & EXPORT ---
    function exportHistory() {
      if (savedList.length === 0) return alert("Nessun anime da esportare.");
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(savedList, null, 2));
      const a = document.createElement('a'); a.href = dataStr; a.download = `preferiti_${currentUser}.json`;
      document.body.appendChild(a); a.click(); a.remove(); toggleMenu();
    }
    function triggerImport() { document.getElementById('import-file').click(); toggleMenu(); }
    
    function importHistory(event) {
      const file = event.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const importedData = JSON.parse(e.target.result);
          if (Array.isArray(importedData)) {
            const existingIds = new Set(savedList.map(a => a.id));
            const filteredNew = importedData.filter(a => a.id && !existingIds.has(a.id));
            savedList = [...savedList, ...filteredNew];
            localStorage.setItem(`binge_saved_${currentUser}`, JSON.stringify(savedList));
            alert(`✅ Importati ${filteredNew.length} anime!`);
            renderFavoritesRow();
          }
        } catch (err) { alert("❌ File non valido."); }
      };
      reader.readAsText(file);
    }

    // AVVIO
    initUserSession();
  </script>
</body>
</html>

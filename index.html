<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BINGE 🍿 - Netflix Style</title>
  <style>
    :root {
      --bg-main: #141414;
      --card-bg: #181818;
      --text-main: #ffffff;
      --text-muted: #aaaaaa;
      --netflix-red: #e50914;
      --badge-blue: #3b82f6;      
      --badge-green: #10b981;     
      --badge-purple: #a855f7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      padding-bottom: 50px;
      overflow-x: hidden;
    }

    header {
      background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
      padding: 15px 4%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      transition: background 0.3s;
    }

    header.scrolled { background: #141414; }

    .logo {
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--netflix-red);
      letter-spacing: 1.5px;
    }

    .menu-container { position: relative; }

    .menu-btn {
      background: rgba(0,0,0,0.6);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.3);
      padding: 6px 14px;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      right: 0; top: 40px;
      background: #000;
      border: 1px solid #333;
      border-radius: 4px;
      width: 200px;
      z-index: 110;
    }

    .dropdown-menu.show { display: block; }

    .dropdown-item {
      padding: 12px 15px;
      font-size: 0.85rem;
      color: #fff;
      cursor: pointer;
      border-bottom: 1px solid #222;
    }
    .dropdown-item:hover { background: #222; }

    /* Controls Bar */
    .controls-container {
      margin-top: 80px;
      padding: 0 4%;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1;
      min-width: 200px;
      padding: 10px 15px;
      background: #222;
      border: 1px solid #444;
      color: #fff;
      border-radius: 4px;
      outline: none;
    }

    .year-select {
      padding: 10px;
      background: #222;
      border: 1px solid #444;
      color: #fff;
      border-radius: 4px;
      outline: none;
    }

    /* Rows Layout */
    .row-container {
      margin-top: 25px;
      padding: 0 0 0 4%;
    }

    .row-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 10px;
      color: #e5e5e5;
    }

    .row-posters {
      display: flex;
      overflow-x: auto;
      overflow-y: hidden;
      gap: 10px;
      padding-bottom: 15px;
      scroll-behavior: smooth;
    }

    .row-posters::-webkit-scrollbar { height: 6px; }
    .row-posters::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

    .netflix-card {
      flex: 0 0 auto;
      width: 140px;
      position: relative;
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s;
      background: var(--card-bg);
    }

    @media (min-width: 768px) {
      .netflix-card { width: 170px; }
    }

    .netflix-card:hover { transform: scale(1.05); z-index: 10; }

    .netflix-card img {
      width: 100%;
      height: 210px;
      object-fit: cover;
      display: block;
    }

    @media (min-width: 768px) {
      .netflix-card img { height: 250px; }
    }

    .rank-number {
      position: absolute;
      bottom: -10px; left: -5px;
      font-size: 3.5rem;
      font-weight: 900;
      color: #000;
      -webkit-text-stroke: 2px var(--netflix-red);
      line-height: 1;
      pointer-events: none;
    }

    .status-badge {
      position: absolute;
      top: 6px; right: 6px;
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 0.55rem;
      font-weight: 800;
      color: #fff;
      text-transform: uppercase;
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }

    .badge-blue { background: var(--badge-blue); }
    .badge-green { background: var(--badge-green); }
    .badge-purple { background: var(--badge-purple); }

    .card-title {
      padding: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Modal */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); z-index: 200;
      justify-content: center; align-items: center; padding: 20px;
    }

    .modal-content {
      background: #181818; color: #fff; width: 100%; max-width: 550px;
      border-radius: 8px; padding: 20px; max-height: 85vh; overflow-y: auto;
    }

    .close-btn { float: right; font-size: 1.5rem; cursor: pointer; color: #aaa; }

    .modal-meta {
      display: flex;
      gap: 15px;
      font-size: 0.85rem;
      color: var(--badge-blue);
      font-weight: 700;
      margin: 10px 0;
    }

    .action-btn {
      width: 100%; margin-top: 15px; padding: 12px;
      background: var(--netflix-red); color: #fff;
      border: none; border-radius: 4px; font-weight: 700; cursor: pointer;
    }
  </style>
</head>
<body>

  <header id="header">
    <div class="logo">BINGE</div>
    <div class="menu-container">
      <button class="menu-btn" onclick="toggleMenu()">⚙️️ Menù ▼</button>
      <div class="dropdown-menu" id="dropdown-menu">
        <div class="dropdown-item" onclick="exportHistory()">📥 Esporta Cronologia</div>
        <div class="dropdown-item" onclick="triggerImport()">📤 Importa Cronologia</div>
        <div class="dropdown-item" onclick="location.reload()">🏠 Home / Refresh</div>
      </div>
    </div>
  </header>

  <input type="file" id="import-file" style="display:none" onchange="importHistory(event)">

  <div class="controls-container">
    <input type="text" id="search-input" class="search-input" placeholder="🔍 Cerca qualsiasi anime..." oninput="handleSearch()">
    
    <!-- Filtro Annate -->
    <select id="year-select" class="year-select" onchange="filterByYear()">
      <option value="">📅 Cerca per Annata</option>
      <option value="2020..2026">Anni 2020+</option>
      <option value="2010..2019">Anni 2010-2019</option>
      <option value="2000..2009">Anni 2000-2009</option>
      <option value="1990..1999">Anni '90</option>
      <option value="1980..1989">Anni '80</option>
    </select>
  </div>

  <div id="searchResultsSection" class="row-container" style="display:none;">
    <div class="row-title" id="search-title">Risultati Ricerca</div>
    <div class="row-posters" id="search-grid"></div>
  </div>

  <div id="mainRows">
    <!-- 1° Linea: Preferiti -->
    <div class="row-container">
      <div class="row-title">❤️ I Tuoi Preferiti</div>
      <div class="row-posters" id="row-favorites"></div>
    </div>

    <!-- 2° Linea: Consigliati IA -->
    <div class="row-container">
      <div class="row-title">🤖 Consigliati dall'IA per Te</div>
      <div class="row-posters" id="row-ai-recommendations"></div>
    </div>

    <!-- 3° Linea: Top 10 Italia -->
    <div class="row-container">
      <div class="row-title">🏆 Top 10 Italia</div>
      <div class="row-posters" id="row-top-ita"></div>
    </div>

    <!-- 4° Linea: Top 10 Mondo -->
    <div class="row-container">
      <div class="row-title">🌍 Top 10 Mondo</div>
      <div class="row-posters" id="row-top-world"></div>
    </div>

    <!-- 5° Linea: I Popolari -->
    <div class="row-container">
      <div class="row-title">🔥 I Popolari</div>
      <div class="row-posters" id="row-popular"></div>
    </div>
  </div>

  <!-- Modal Dettaglio -->
  <div class="modal" id="anime-modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <h2 id="modal-title"></h2>
      <div class="modal-meta">
        <span id="modal-episodes">📺 -- Episodi</span>
        <span id="modal-status">🟢 Status</span>
      </div>
      <p id="modal-description" style="font-size: 0.85rem; color: #ccc; line-height: 1.4;"></p>
      <button class="action-btn" id="save-btn" onclick="toggleSaveAnime()">➕ Aggiungi ai Preferiti</button>
    </div>
  </div>

  <script>
    let savedList = JSON.parse(localStorage.getItem('binge_saved') || '[]');
    let currentAnimeData = [];
    let selectedAnimeId = null;
    let searchTimeout = null;

    window.onscroll = () => {
      document.getElementById('header').classList.toggle('scrolled', window.scrollY > 50);
    };

    function toggleMenu() {
      document.getElementById('dropdown-menu').classList.toggle('show');
    }

    function getAnimeBadge(status) {
      const st = (status || '').toLowerCase();
      if (st.includes('current') || st.includes('airing')) return { class: 'badge-blue', label: 'IN CORSO' };
      if (st.includes('upcoming') || st.includes('unreleased')) return { class: 'badge-purple', label: 'PROSSIMAMENTE' };
      return { class: 'badge-green', label: 'COMPLETO' };
    }

    async function fetchKitsuCategory(queryUrl, elementId, isRanked = false) {
      try {
        const res = await fetch(queryUrl);
        const data = await res.json();
        const items = data.data || [];

        const container = document.getElementById(elementId);
        if (!container) return;
        container.innerHTML = '';

        if (items.length === 0) {
          container.innerHTML = '<div style="color:#777; font-size:0.85rem; padding:10px;">Nessun anime trovato.</div>';
          return;
        }

        items.forEach((item, index) => {
          const epCount = item.attributes.episodeCount ? `${item.attributes.episodeCount} Ep.` : 'In corso / Speciale';
          
          const anime = {
            id: item.id,
            title: item.attributes.canonicalTitle,
            coverImage: item.attributes.posterImage?.small || item.attributes.posterImage?.original,
            synopsis: item.attributes.synopsis || "Nessuna descrizione disponibile.",
            episodes: epCount,
            status: item.attributes.status
          };

          currentAnimeData.push(anime);
          const badge = getAnimeBadge(anime.status);

          const card = document.createElement('div');
          card.className = 'netflix-card';
          card.onclick = () => openModal(anime.id);
          card.innerHTML = `
            <img src="${anime.coverImage}" alt="${anime.title}" loading="lazy">
            <div class="status-badge ${badge.class}">${badge.label}</div>
            ${isRanked ? `<div class="rank-number">${index + 1}</div>` : ''}
            <div class="card-title">${anime.title}</div>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        console.error("Errore nel caricamento:", err);
      }
    }

    // Carica la 1° Riga: Preferiti
    function renderFavoritesRow() {
      const container = document.getElementById('row-favorites');
      container.innerHTML = '';

      if (savedList.length === 0) {
        container.innerHTML = '<div style="color:#777; font-size:0.85rem; padding:10px;">Aggiungi qui i tuoi preferiti cliccando sugli anime.</div>';
        return;
      }

      savedList.forEach(anime => {
        currentAnimeData.push(anime);
        const badge = getAnimeBadge(anime.status);

        const card = document.createElement('div');
        card.className = 'netflix-card';
        card.onclick = () => openModal(anime.id);
        card.innerHTML = `
          <img src="${anime.coverImage}" alt="${anime.title}">
          <div class="status-badge ${badge.class}">${badge.label}</div>
          <div class="card-title">${anime.title}</div>
        `;
        container.appendChild(card);
      });
    }

    // Carica la 2° Riga: Suggeriti dall'IA
    function renderAIRecommendations() {
      if (savedList.length > 0) {
        // Se ci sono preferiti, usa il primo per trovare simili
        const lastSaved = savedList[savedList.length - 1];
        const keyword = encodeURIComponent(lastSaved.title.split(' ')[0]);
        fetchKitsuCategory(`https://kitsu.io/api/edge/anime?filter[text]=${keyword}&page[limit]=10`, 'row-ai-recommendations');
      } else {
        // Se vuoto, carica anime consigliati generali
        fetchKitsuCategory('https://kitsu.io/api/edge/anime?page[limit]=10&sort=-average_rating', 'row-ai-recommendations');
      }
    }

    function initNetflixHome() {
      currentAnimeData = [];
      renderFavoritesRow();
      renderAIRecommendations();

      // Top 10 Italia & Mondo & Popolari
      fetchKitsuCategory('https://kitsu.io/api/edge/anime?page[limit]=10&sort=-user_count', 'row-top-ita', true);
      fetchKitsuCategory('https://kitsu.io/api/edge/anime?page[limit]=10&sort=-average_rating', 'row-top-world', true);
      fetchKitsuCategory('https://kitsu.io/api/edge/anime?page[limit]=15&sort=popularityRank', 'row-popular');
    }

    function handleSearch() {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(async () => {
        const query = document.getElementById('search-input').value.trim();
        document.getElementById('year-select').value = '';
        
        const searchSection = document.getElementById('searchResultsSection');
        const mainRows = document.getElementById('mainRows');

        if (!query) {
          searchSection.style.display = 'none';
          mainRows.style.display = 'block';
          return;
        }

        searchSection.style.display = 'block';
        mainRows.style.display = 'none';
        document.getElementById('search-title').innerText = `Risultati Ricerca per: "${query}"`;

        fetchKitsuCategory(`https://kitsu.io/api/edge/anime?filter[text]=${encodeURIComponent(query)}&page[limit]=20`, 'search-grid');
      }, 400);
    }

    function filterByYear() {
      const yearRange = document.getElementById('year-select').value;
      document.getElementById('search-input').value = '';
      
      const searchSection = document.getElementById('searchResultsSection');
      const mainRows = document.getElementById('mainRows');

      if (!yearRange) {
        searchSection.style.display = 'none';
        mainRows.style.display = 'block';
        return;
      }

      searchSection.style.display = 'block';
      mainRows.style.display = 'none';
      document.getElementById('search-title').innerText = `Anime per Annata (${yearRange})`;

      fetchKitsuCategory(`https://kitsu.io/api/edge/anime?filter[seasonYear]=${yearRange}&page[limit]=20&sort=-user_count`, 'search-grid');
    }

    function openModal(id) {
      const anime = currentAnimeData.find(a => a.id === id);
      if (!anime) return;

      selectedAnimeId = id;
      document.getElementById('modal-title').innerText = anime.title;
      document.getElementById('modal-episodes').innerText = `📺 Puntate: ${anime.episodes || 'N.D.'}`;
      document.getElementById('modal-status').innerText = `🟢 Stato: ${(anime.status || 'N.D.').toUpperCase()}`;
      document.getElementById('modal-description').innerText = anime.synopsis;

      const isSaved = savedList.some(item => item.id === id);
      document.getElementById('save-btn').innerText = isSaved ? "❌ Rimuovi dai Preferiti" : "➕ Aggiungi ai Preferiti";

      document.getElementById('anime-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('anime-modal').style.display = 'none';
    }

    function toggleSaveAnime() {
      const anime = currentAnimeData.find(a => a.id === selectedAnimeId);
      if (!anime) return;

      const index = savedList.findIndex(item => item.id === selectedAnimeId);
      if (index > -1) {
        savedList.splice(index, 1);
        document.getElementById('save-btn').innerText = "➕ Aggiungi ai Preferiti";
      } else {
        savedList.push(anime);
        document.getElementById('save-btn').innerText = "❌ Rimuovi dai Preferiti";
      }
      localStorage.setItem('binge_saved', JSON.stringify(savedList));
      renderFavoritesRow();
      renderAIRecommendations();
    }

    // --- Export / Import Cronologia ---
    function exportHistory() {
      if (savedList.length === 0) {
        alert("Nessun anime nei preferiti da esportare.");
        return;
      }
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(savedList, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "preferiti_binge.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function triggerImport() {
      document.getElementById('import-file').click();
    }

    function importHistory(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (Array.isArray(imported)) {
            savedList = imported;
            localStorage.setItem('binge_saved', JSON.stringify(savedList));
            alert("✅ Cronologia preferiti importata con successo!");
            renderFavoritesRow();
            renderAIRecommendations();
          }
        } catch (err) {
          alert("❌ File non valido.");
        }
      };
      reader.readAsText(file);
    }

    // Avvio Iniziale
    initNetflixHome();
  </script>
</body>
</html>
